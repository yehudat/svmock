name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [master]

env:
  VERILATOR_VERSION: v5.024
  SVUNIT_VERSION: master

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install g++ 10
        run: sudo apt-get install -y g++-10
            && echo "CXX=g++-10" >> "$GITHUB_ENV"

      - name: Install Verilator dependencies
        run: |
            sudo apt-get install -y \
                git help2man perl make \
                libfl2 \
                libfl-dev \
                zlib1g zlib1g-dev \
                git autoconf flex bison

      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}-${{ runner.os }}

      - name: Clone Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: git clone https://github.com/verilator/verilator $HOME/verilator
            && cd $HOME/verilator
            && git checkout $VERILATOR_VERSION

      - name: Build Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: cd $HOME/verilator
            && autoconf
            && ./configure --prefix /opt/verilator
            && make -j `nproc`

      - name: Install Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: cd $HOME/verilator
            && sudo make install

      - name: Add Verilator to $PATH
        run: echo "/opt/verilator/bin" >> $GITHUB_PATH

      - name: Clone SVUnit
        run: git clone https://github.com/svunit/svunit $HOME/svunit
            && cd $HOME/svunit
            && git checkout $SVUNIT_VERSION

      - name: Run tests
        run: |
          # Setup.bsh uses `pwd` to set SVUNIT_INSTALL, so it must be sourced
          # from the SVUnit checkout root.
          cd $HOME/svunit
          source Setup.bsh
          cd $GITHUB_WORKSPACE/test/ut
          runSVUnit -s verilator
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # L1 tier: also run the bedrock example end-to-end
            cd $GITHUB_WORKSPACE/examples/class/bedrock
            runSVUnit -s verilator
          fi
